# Query indexes for dynamic listings (press archives, insights hubs, search).
# Metadata contract: every article/press page emits publishdate, category,
# template, locale via its metadata block (authored at import time).
version: 1

indices:
  default:
    include:
      - '/**'
    exclude:
      - '/fragments/**'
      - '/de/fragments/**'
      - '/jp/fragments/**'
      - '/nav'
      - '/footer'
      - '/**/nav'
      - '/**/footer'
      - '/redirects.json'
    target: /query-index.xlsx
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      locale:
        select: head > meta[name="locale"]
        value: attribute(el, "content")
      publishdate:
        select: head > meta[name="publishdate"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
