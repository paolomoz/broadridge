      const titles = ['Advisor Compensation', 'Advisor Desktop Solutions', 'Advisor Onboarding', 'Advisor Targeting'];
      const mock = { total: titles.length, offset: 0, limit: 5000,
        data: titles.map((t, i) => ({ path: `/mock/${i}`, title: `Broadridge - ${t}`,
          description: `${t} description.`, template: 'landing', category: '', lastModified: `${1756000000 + i}` })) };
      const orig = window.fetch.bind(window);
      window.fetch = (u, ...a) => (String(u).includes('/query-index.json')
        ? Promise.resolve(new Response(JSON.stringify(mock), { status: 200, headers: { 'Content-Type': 'application/json' } }))
        : orig(u, ...a));
    })();
