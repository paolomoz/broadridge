<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="nav" content="/test/figma/n1-nav-fragment">
  <meta name="footer" content="/test/figma/n2-footer-fragment">
  <title>gate: n1 header (search active — empty input)</title>
  <script nonce="aem" src="/scripts/aem.js" type="module"></script>
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <link rel="stylesheet" href="/styles/typekit.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    .consent-banner { display: none; }
    footer { display: none; }
    body { height: 287px; background: #f9f9f9; }
    main { display: none; }
    header nav .nav-flyout, header nav * { transition: none !important; }
    /* deterministic caret: harness blurs the input after opening */
  </style>
  <script>
    // harness: reach the kit Search Active state (627:6037) through the
    // production code path — click the promobar search trigger
    const poll = setInterval(() => {
      const trigger = document.querySelector('header .nav-search-trigger');
      if (!trigger) return;
      clearInterval(poll);
      trigger.click();
      const input = document.querySelector('header .nav-search-input');
      if (input) input.blur();
    }, 50);
  </script>
</head>
<body>
  <header></header>
  <main><div><p>gate page</p></div></main>
  <footer></footer>
</body>
</html>
