<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="nav" content="/test/figma/n1-nav-fragment">
  <meta name="footer" content="/test/figma/n2-footer-fragment">
  <title>gate: n1 header (search open — typed + recommendations)</title>
  <script>
    // kit specimen suggestions (627:6047 Recommendations panel);
    // production has no autocomplete endpoint — the block's provider
    // seam is fed by the harness, rendering runs the production path
    window.headerSearchSuggestions = ['advisors', 'advisory', 'advisor’s', 'advisorstream'];
  </script>
  <script nonce="aem" src="/scripts/aem.js" type="module"></script>
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <link rel="stylesheet" href="/styles/typekit.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    .consent-banner { display: none; }
    footer { display: none; }
    body { height: 287px; background: #f9f9f9; }
    main { display: none; }
    header nav * { transition: none !important; }
  </style>
  <script>
    const poll = setInterval(() => {
      const trigger = document.querySelector('header .nav-search-trigger');
      const input = document.querySelector('header .nav-search-input');
      if (!trigger || !input) return;
      clearInterval(poll);
      trigger.click();
      input.value = 'advi';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.blur(); // deterministic: no caret in the screenshot
    }, 50);
  </script>
</head>
<body>
  <header></header>
  <main><div><p>gate page</p></div></main>
  <footer></footer>
</body>
</html>
